  <rect x="460" y="155" width="160" height="38" rx="8" fill="none" stroke="#0a0a0a" stroke-width="1.2" opacity="0.9"/>
  <text x="470" y="178" font-family="Arial" font-size="11" fill="rgba(0,0,0,0.35)">▢ Email</text>
  <rect x="460" y="205" width="160" height="38" rx="8" fill="none" stroke="#0a0a0a" stroke-width="1.2" opacity="0.9"/>
  <text x="470" y="228" font-family="Arial" font-size="11" fill="rgba(0,0,0,0.35)">▢ Password</text>
  <rect x="460" y="265" width="160" height="36" rx="18" fill="#0a0a0a"/>
  <text x="540" y="288" font-family="Arial" font-size="11" letter-spacing="2" text-anchor="middle" fill="white">LOGIN →</text>
  <text x="540" y="315" font-family="Arial" font-size="9" letter-spacing="1" text-anchor="middle" fill="rgba(0,0,0,0.45)">MINIMALIST AUTH UI</text>
