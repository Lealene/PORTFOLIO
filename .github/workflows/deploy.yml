# Deploy Vite + React portfolio to GitHub Pages
# Docs: https://vite.dev/guide/static-deploy
# This repo needs ONE manual step in GitHub UI to allow the workflow to create the Pages site:
#   Settings → Pages → Build and deployment → Source → GitHub Actions
#   Settings → Actions → General → Workflow permissions → Read and write permissions → Save
# After that, every push to main auto-deploys with base '/PORTFOLIO/' (vite.config.js:10).
# See also: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
