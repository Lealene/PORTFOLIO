# Deploy Vite + React portfolio to GitHub Pages — DISABLED (deploy is on Vercel)
# If you want GitHub Pages instead of Vercel, re-enable by restoring `push: branches: [main]`
# and do ONE manual step: Settings → Pages → Build and deployment → Source → GitHub Actions
# + Settings → Actions → General → Workflow permissions → Read and write → Save
name: Deploy to GitHub Pages (disabled — Vercel is active)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
